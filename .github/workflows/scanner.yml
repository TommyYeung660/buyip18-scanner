name: High-speed scanner (node rotation, in-job loop)
on:
  schedule:
    - cron: "*/15 * * * *"   # watchdog：掃描器不在就重啟
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "本輪掃描時長（分鐘）"
        default: "320"

permissions:
  contents: read
  actions: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Skip if already scanning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(gh run list -R ${{ github.repository }} --workflow scanner.yml \
              --status in_progress --json databaseId --jq 'length')
          echo "in_progress=$N"
          if [ "$N" -gt 1 ]; then echo "已有掃描器運行 — 跳過"; exit 42; fi

      - name: Install mihomo
        run: |
          MH_VER=v1.19.30
          curl -sL -o /tmp/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MH_VER}/mihomo-linux-amd64-v1-${MH_VER}.gz"
          gunzip -f /tmp/mihomo.gz && chmod +x /tmp/mihomo && sudo mv /tmp/mihomo /usr/local/bin/mihomo

      - name: Start mihomo (nodes from secret)
        env:
          SCAN_NODES_JSON: ${{ secrets.SCAN_NODES_JSON }}
          SLOT_PROXIES_JSON: ${{ secrets.SLOT_PROXIES_JSON }}
        run: |
          python3 - <<'EOF'
          import json, os
          nodes = json.loads(os.environ["SCAN_NODES_JSON"])
          # BUY 出口組只准香港節點（結帳必須 HK IP；「家宽」關鍵字會誤中韓台日美家寬）。
          # 家寬永遠優先（生產實證乾淨），其餘按出口品質排序墊後：
          # 直连/原生 → IPLC → 專線（9/17 生產 541 實證，只當最後手段）。
          # 健康檢查走商店端點：success.html 探不到 Akamai 541 風控擋頁
          def _buy_rank(name):
              if "家宽" in name: return 0
              if "直连" in name or "原生" in name: return 1
              if "IPLC" in name: return 2
              return 3
          hk_buy = sorted([n["name"] for n in nodes
                           if "香港" in n["name"]], key=_buy_rank)
          # per-slot 專屬出口（供應商無關）：SLOT_PROXIES_JSON = [host,port,user,pass] 陣列，
          # 第 i 個 → keeper slot i 專用 listener 7892+i。讓 N 個駐場各走獨立 IP
          # （原單出口 N 併發＝541＋一個 IP 被封全部同時失明）。無 secret＝全走 7891 免費池。
          try:
              slot_proxies = json.loads(os.environ.get("SLOT_PROXIES_JSON") or "[]")
          except Exception:
              slot_proxies = []
          listeners = [{"name": "buy", "type": "mixed", "port": 7891,
                        "listen": "127.0.0.1", "proxy": "BUY"}]
          proxies = list(nodes)
          for i, p in enumerate(slot_proxies):
              nm = "SLOT%02d" % i
              proxies.append({"name": nm, "type": "http", "server": p["host"],
                              "port": int(p["port"]), "username": p["user"],
                              "password": p["pass"]})
              listeners.append({"name": "slot%d" % i, "type": "mixed",
                                "port": 7892 + i, "listen": "127.0.0.1",
                                "proxy": nm})
          cfg = {
            "mixed-port": 7890,
            "external-controller": "127.0.0.1:9090",
            "mode": "rule",
            "log-level": "warning",
            "dns": {"enable": True, "nameserver": ["8.8.8.8", "1.1.1.1"]},
            "listeners": listeners,
            "proxies": proxies,
            "proxy-groups": [
              {"name": "SCAN", "type": "select",
               "proxies": [n["name"] for n in nodes]},
              {"name": "BUY", "type": "fallback",
               "proxies": hk_buy or [nodes[0]["name"]],
               "url": "https://www.apple.com/hk-zh/shop/retail/pickup-message?pl=true&fae=true&mts.0=regular&parts.0=MJXQ4ZA/A&location=Hong%20Kong",
               "interval": 60, "expected-status": "200", "lazy": False},
            ],
            "rules": ["MATCH,SCAN"],
          }
          os.makedirs("/tmp/mihomo-data", exist_ok=True)
          json.dump(cfg, open("/tmp/scanner-mihomo.yaml", "w"), ensure_ascii=False)
          print("節點:", len(nodes), "| BUY 出口:", hk_buy or "（無家寬，退全部）")
          print("per-slot 專屬出口:", ("%d 個（7892-%d）" % (len(slot_proxies),
                7891 + len(slot_proxies))) if slot_proxies else "未啟用")
          EOF
          nohup mihomo -f /tmp/scanner-mihomo.yaml -d /tmp/mihomo-data > /tmp/mihomo.log 2>&1 &
          for i in $(seq 1 15); do
            curl -s -m 3 -x http://127.0.0.1:7890 https://api.ipify.org && break
            sleep 2
          done
          echo "出口: $(curl -s -m 8 -x http://127.0.0.1:7890 https://api.ipify.org)"
          N=$(python3 -c "import json,os;print(len(json.loads(os.environ.get('SLOT_PROXIES_JSON') or '[]')))")
          if [ "$N" -gt 0 ]; then
            for i in $(seq 0 $((N-1))); do
              echo "slot$i 出口: $(curl -s -m 12 -x http://127.0.0.1:$((7892+i)) https://api.ipify.org)"
            done
          fi

      - name: Install checkout engine stack (cached)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb > /dev/null
          pip install -q playwright
          python -m playwright install-deps chromium > /dev/null 2>&1
          Xvfb :99 -screen 0 1280x900x24 > /dev/null 2>&1 &
          sleep 1

      - name: Start VNC + tunnel (live view for keeper)
        run: |
          # 與 checkout.yml 同款：隨機密碼只寫 private repo 的 status/latest.json，
          # 公開 log 只現隧道 URL（無密碼進不去），絕不 echo 密碼
          sudo apt-get install -y -qq x11vnc fluxbox > /dev/null
          pip install -q websockify
          git clone -q --depth 1 https://github.com/novnc/noVNC /tmp/novnc
          curl -sL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb > /dev/null
          VNC_PW=$(head -c 9 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 8)
          DISPLAY=:99 fluxbox > /dev/null 2>&1 &
          x11vnc -display :99 -forever -passwd "$VNC_PW" -quiet -rfbport 5900 > /dev/null 2>&1 &
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 8080 > /tmp/novnc.log 2>&1 &
          sleep 3
          nohup cloudflared tunnel --url http://localhost:8080 --no-autoupdate > /tmp/cf.log 2>&1 &
          U=""
          for i in $(seq 1 30); do
            U=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$U" ] && break
            sleep 1
          done
          echo "VNC_URL=$U" >> $GITHUB_ENV
          # 密碼不進 GITHUB_ENV——env 值會被印進每個 step 的 env dump（公開 log），
          # 改落檔由 scanner.py 讀取（9/19 體檢發現的洩漏路徑）
          printf '%s' "$VNC_PW" > /tmp/vncpw
          chmod 600 /tmp/vncpw
          echo "即時畫面隧道: ${U:-（未取得）}"

      - name: Resolve Playwright version
        id: pwv
        run: echo "ver=$(pip show playwright | awk '/^Version/{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright chromium (restore)
        id: pwc
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ steps.pwv.outputs.ver }}

      - name: Install chromium (cache-aware)
        run: python -m playwright install chromium > /dev/null 2>&1

      - name: Run scanner loop
        env:
          SCAN_NODES_JSON: ${{ secrets.SCAN_NODES_JSON }}
          # per-slot 專屬出口：scanner.py 模組載入時算 SLOT_PROXY_COUNT，
          # keeper_port(slot) 才會回 7892+slot。先前只有 mihomo step 拿到這個
          # secret（所以 listener 7892-7896 有建），本 step 拿不到 → 常數=0 →
          # 六個 keeper 全落回 7891 共用免費池，買來的 5 個 IPRoyal IP 從未被使用
          # （9/19 hit#19 根因：共用出口互相 541 拖死會話）。
          SLOT_PROXIES_JSON: ${{ secrets.SLOT_PROXIES_JSON }}
          SCAN_NODES_FILE: /tmp/nodes.json
          MAX_MINUTES: ${{ inputs.max_minutes || '320' }}
          GH_PAT: ${{ secrets.CHECKOUT_PAT }}
          BARK_URL: ${{ secrets.BARK_URL }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PROFILES_JSON: ${{ secrets.PROFILES_JSON }}
          # 動態停泊（階段 1 影子模式）**已於 9/23 關閉**——用戶裁決「收停泊」。
          # 關閉理由是影子模式的核心前提已被真命中否證：9/23 08:29:52
          # MJY04ZA/A @ Causeway Bay R409，slot4 的 `parked_at=R409`（停泊店＝命中店），
          # 回報 `park_survived=false`，且逐步耗時 選店 1088ms／取貨聯絡人 10031ms／
          # billing continue 10021ms——停泊期提交的 contact/billing 沒有活過額度消失，
          # 命中時仍要走完整條鏈。∴ 停泊只付成本（每次佔掉 22-33 秒 POST 窗，且是紀錄中
          # keeper「每小時一退」exit 43 的可疑來源）、不收報成。
          # 只關 KEEPER_PARK_STORE（＝不再下令停泊、keeper 也不再處理停泊命令）；
          # 程式碼保留，若日後要重驗前提 1 只需把這裡改回 "1"。
          # KEEPER_PARK_SHADOW 仍必須是 "1"：它守住快路徑（單一 placeOrder）＝**下單
          # 行為與開啟前逐字相同**，零下單風險。刻意寫出 SHADOW=1 而不依賴程式預設值：
          # 預設值一旦被改，這裡會靜默變成真正的下單路徑。
          # 這些變數會被 keeper 子進程繼承（scanner.py 的 env=dict(os.environ,…)），
          # 所以 keeper 引擎（另 clone 的 buyip18-checkout）看得到。
          KEEPER_PARK_STORE: "0"
          KEEPER_PARK_SHADOW: "1"
          # 導航鏈（9/22 實測，見 work/latency-repro/FINDINGS.md + nav_chain_cost.py）：
          # checkoutx POST 的 10 秒節流是**伺服器端、以頁面檢視為單位**的閘，
          # 而一次真正的文件載入會把它清零。∴ 命中鏈每一步改成「導航 + POST」，
          # 每步約 0.9 秒 ⇒ 3-4 步鏈約 2.6-3.5 秒，直接落進 1-10 秒的庫存窗口，
          # **不必先成功停泊**。這是目前唯一能讓「命中店≠停泊店」那 9 成命中
          # 也有機會贏的改動。
          KEEPER_NAV_CHAIN: "1"
          # ⛔ 9/25 定案：自構造導航**不清閘**，已關閉（KEEPER_NAV_ANY=0）。
          # 反證＝在 runner 上呼叫生產自己的 keeper_buy_http（真 POST 字串、DRY_RUN
          # 停在 placeOrder 前），單一發命中鏈實測：
          #   選店R485 → http=200 483ms（第一發本來就免罰）
          #   nav 到 ?_s=Shipping-init：導航 612ms、**stk 沒換**（頁面檢視沒變）
          #   取貨聯絡人 → **9305ms** ⇒ 與節流定律 max(235, 10000−gap) 的預測
          #   （gap≈0.7s ⇒ ~9.3s）逐毫秒吻合 ⇒ 導航沒清閘，只是白花 ~0.6s。
          # 生產三次命中（9/25 09:42/09:46/10:00）同形狀：nav=2、nav_stk=False，
          # 7 發 POST 有 6 發被墊 7.5-9.2 秒。
          # 註：9/22「goto 後 228ms」與 9/23「goto 後 6685ms」是同實驗的相反結果
          # （同型主機、隔天）⇒ 導航效果不穩定，不可依賴。
          # 保留 KEEPER_NAV_CHAIN=1（站方真的給 head.data.url 時仍會導航），
          # 只關自構造目標；每條命中鏈省下 ~1.2-3.1 秒。
          KEEPER_NAV_ANY: "0"
          # 主動錯開回收（scanner.py 的 keeper_recycle_old）。9/23 實測：keeper 的
          # 會話齡滿 ~25 分鐘就失明——保活連續 3 次例外自曝退出（exit 43），證據是
          # 兩個死亡波次（09:42-09:46、10:07-10:12）的年齡幾乎相同（1448-1535 秒），
          # 而第二波那批 process 是 09:42-09:46 才啟動的：若是 wall-clock 外部事件，
          # 它們該在不同年齡死。被動等它自己死＝整隊同刻全滅（實測 5 個 slot 在
          # 4 分鐘內一起死、掉到 2/6，還有一發命中撞上已失明的會話、鏈一步都沒跑）。
          # 1080 秒（18 分）＝距失明起點（~21 分）留 3 分鐘餘裕；一次只回收一個、
          # 有 slot 在 buying 或有任何進程已死就整輪不動。
          KEEPER_RECYCLE_S: "1080"
          # 建袋重試輪數（checkout.py 的 fill_bag）。為什麼在峰值中途調高：
          # 9/23 峰值 07:00-07:30 實測艦隊時間加權只有 6/6 15.4%、5/6 30.6%、
          # 4/6 29.6%、3/6 7.4%、2/6 16.9%（平均 ≈3.9/6，昨天同期 5.4/6），
          # 重建 34.9 次/小時（昨天 ~14）。每一次失敗的訊息都一樣：
          # 「袋內實際 0 項（計數器 0、3 輪全部候選失敗）」——3 輪預算用盡。
          # 而 541 是機率性閘、重試會恢復；每一次「換乾淨 session 重試」等價於
          # 一次重啟所做的事，但便宜得多（不用重開 Chromium、不用重走預熱）。
          # ⇒ 加輪數＝用便宜的方式換取同樣的第二次機會。風險有界：多花的時間
          # 上限約 2 輪 × 40 秒，遠低於建袋看門狗的 420 秒。
          # 入袋重試：541 是「每次文件載入」的機率閘（9/26 runner 四臂 A/B：同出口同 UA
          # 反覆載入成功率 0/6-4/6，UA 與出口都不是決定因素）。便宜輪＝只重載商品頁，
          # 貴輪＝換乾淨 session（會清空訪客車）。實測失敗率約 p≈0.6/次載入 ⇒
          # 6 輪用盡仍有 ~5%（夜間 9 小時實際 exhaust 7 次），10 輪 → ~0.7%。
          # 便宜輪多、貴輪只留最後 3 輪（成本不對稱）。
          ADD_RETRY_ROUNDS: "10"
          ADD_RETRY_RELOAD_UNTIL: "7"
          VNC_URL: ${{ env.VNC_URL }}
        run: |
          date +%s > /tmp/jobstart
          python3 - <<'EOF'
          import json, os
          nodes = json.loads(os.environ["SCAN_NODES_JSON"])
          json.dump(nodes, open("/tmp/nodes.json", "w"), ensure_ascii=False)
          EOF
          set -o pipefail
          python3 src/scanner.py 2>&1 | tee scanner.log

      - name: Self-resurrect (即時補位，消 keeper 空窗)
        if: always() && job.status != 'cancelled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 命中後/到時/崩潰都即時 dispatch 下一輪（keeper 空窗從 ~15-30 分壓到冷啟 ~2.5 分）。
          # 防抖：job 生命 <10 分不復活（疑似 crash loop，交 watchdog */15 兜底）。
          # 豁免：命中收工（/tmp/hit-marker）——9/19 晨兩次命中 run 9-11 分收工被誤當
          # crash loop 不復活，watchdog cron 遲到=命中後 20+ 分盲窗
          [ -f /tmp/jobstart ] || { echo "無 jobstart — 跳過"; exit 0; }
          AGE=$(( $(date +%s) - $(cat /tmp/jobstart) ))
          if [ "$AGE" -lt 600 ] && [ ! -f /tmp/hit-marker ]; then
            echo "job 只跑 ${AGE}s — 疑似 crash loop，不復活（watchdog 兜底）"; exit 0
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/scanner.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "self-dispatch → http=$CODE（job 生命 ${AGE}s）"

      - name: Cache Playwright chromium (save)
        if: always() && steps.pwc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ steps.pwv.outputs.ver }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-log-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            scanner.log
            /tmp/checkout-fallback/engine-run.log
            /tmp/keeper/k*/keeper.log
          # 注意：public repo 的 artifact 人人可下載——絕不上傳引擎截圖（status/*.png
          # 含帳單頁已填卡號+CVV，9/16 leak 審計同款洩漏路徑）；
          # latest.json 亦不上傳（9/17 起含 VNC 密碼，只許推送 private checkout repo）
