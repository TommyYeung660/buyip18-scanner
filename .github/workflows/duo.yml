name: iPhone Duo delivery orders (10-way)

# ⚡ 2026-10-07 iPhone Duo 送貨專案（用戶規格）：
#   · 只做送貨（FULFILLMENT=HOME），不自提、不探庫存
#   · 10 個 profile、一 profile 一 IP（各自專屬上游代理）並發下單
#   · buy_count=2、優先序 256→512→1TB→2TB（每個 profile 指定一款，分散 8 款）
#   · 完整記錄鏈：引擎寫本機帳本 → 本 job 合併推回私有 repo（raw media type、拒絕覆寫歷史）
# ⚠ 這條鏈與已停用的店取 keeper 艦隊（scanner.yml）**完全無關**、互不影響。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry=只跑到 review 不下單；live=真的下單"
        default: "dry"
      wait_until:
        description: "起跑時間 ISO8601（留空=立即；例 2026-10-16T20:00:00+08:00）"
        default: ""
      deadline_min:
        description: "單一 job 的總時限（分鐘）"
        default: "40"
      use_app_config:
        description: "true=用 App 推送的下單配置（不覆蓋 SKU）；false=照 matrix 的每路指定款"
        default: "false"
      profiles:
        description: "profile 名（逗號分隔；留空=duo01..duo10）"
        default: ""
      # ⚡ 10/15：以下旋鈕是為「當晚臨場應變」加的——GitHub 改 workflow env 要 commit，
      # 但 workflow_dispatch 的 input 不用 ⇒ 當晚任何調整都走 input，不改碼。
      auto_json:
        description: "引擎設定檔（auto_duo.json=iPhone Duo；auto.json=iPhone 18 Pro 彩排）"
        default: "auto_duo.json"
      dummy:
        description: "🧪 true=用假資料（公開測試卡號）跑彩排，絕不碰真 profile；必須配 mode=dry"
        default: "false"
      buy_count:
        description: "一張單幾件（Duo 專案＝2）"
        default: "2"
      max_attempts:
        description: "每路最多幾發（被拒會續試；未確認一律停手）"
        default: "3"
      add_rounds:
        description: "入袋重試輪數（機率閘；當晚不夠就往上加）"
        default: "6"
      add_reload:
        description: "每輪最多重載商品頁幾次"
        default: "10"
      slots:
        description: "只跑這幾路（逗號分隔，例 3,5,9；留空=10 路全跑）— 救單用，避免碰到已成功的路"
        default: ""
      product_url:
        description: "商品頁 URL 覆蓋（Apple 改網址時用；留空=照 AUTO_JSON 的 model_slug）"
        default: ""
      line_marker:
        description: "入袋落地頁必須含的字串（改路徑時搭配使用；留空=model_slug）"
        default: ""
      proxy_map:
        description: "出口索引循環表（例 0,1,2,3,4 ⇒ 路 i 用第 i%5 個出口）—出口不足時分兩波跑"
        default: ""
      add_mode:
        description: "入袋方式：留空=頁面內 fetch（預設）；ui=真 UI 點擊（選規格＋按加入購物袋）"
        default: ""
  # ⏸ 2026-10-07 用戶指示「先暫停一切任務」⇒ 定時觸發**先關掉**，避免 10/16 自動開火
  # （卡未就緒、10 組 profile/出口未備妥）。恢復時把下面兩行取消註解即可：
  # schedule:
  #   - cron: "50 11 16 10 *"   # 2026-10-16 19:50 HKT 起跑，job 內等到 20:00

concurrency:
  group: duo-orders
  cancel-in-progress: false

jobs:
  preflight:
    name: "preflight（就緒表）"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 檢查 profiles / 出口形狀（不印值）
        env:
          PROFILES_JSON: ${{ secrets.PROFILES_JSON }}
          SLOT_PROXIES_JSON: ${{ secrets.SLOT_PROXIES_JSON }}
        run: python3 tools/duo_preflight.py
        continue-on-error: true      # 就緒表是給人看的；不足時仍讓各 job 自己判（見 duo_job 的 profile 檢查）

  duo:
    name: "duo slot ${{ matrix.idx }}"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # ⚠ 10/15：這裡一度改成 `${{ ... }}` 表達式，結果整個 duo job 沒被建立
      # （run 38672447501 只有 preflight job，直接 failure）⇒ 保持**靜態數字**。
      # 想要「一次只跑一路」請用 slots 一次給一個路號（同一 concurrency group 會排隊）。
      max-parallel: 10
      # ⚡ 10/08：matrix 只帶**路號**（靜態、不含任何秘密）。GitHub 會擋「可能含 secret」的
      # job output（實測警告 `Skip output 'matrix' since it may contain secret.` ⇒ matrix 變空
      # ⇒ 整個 run 失敗），所以 profile 名與款式改由**每個 job 自己在 runner 內**讀 secret 決定。
      matrix:
        include:
          - { idx: 0 }
          - { idx: 1 }
          - { idx: 2 }
          - { idx: 3 }
          - { idx: 4 }
          - { idx: 5 }
          - { idx: 6 }
          - { idx: 7 }
          - { idx: 8 }
          - { idx: 9 }
    steps:
      - uses: actions/checkout@v4

      - name: 取得結帳引擎（私有 repo）
        env:
          GH_PAT: ${{ secrets.CHECKOUT_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_PAT}@github.com/TommyYeung660/buyip18-checkout.git" engine
          git -C engine log --oneline -1
          ls engine/auto_duo.json

      - name: 安全互鎖（dummy=true 配 mode=live ⇒ 拒跑）
        if: ${{ github.event.inputs.dummy == 'true' && github.event.inputs.mode != 'dry' }}
        run: |
          echo "⛔ dummy=true 只能用 mode=dry（假卡真下單沒有意義，且會把假資料留在 Apple 帳號）"
          exit 1

      # 🛡 10/15：救單時最危險的事是「重跑整批 ⇒ 已成功的路再下一單」。
      # 用 slots 指定要補的路，其他路在這裡就跳過（不啟動瀏覽器、不碰任何 profile）。
      - name: 路號過濾（slots 指定時，其他路跳過）
        env:
          IDX: ${{ matrix.idx }}
          SLOTS: ${{ github.event.inputs.slots }}
        run: |
          if [ -z "$SLOTS" ]; then echo "slots 未指定 ⇒ 10 路全跑"; exit 0; fi
          case ",$(echo "$SLOTS" | tr -d ' ')," in
            *",$IDX,"*) echo "本路 $IDX 在指定清單內 ⇒ 繼續" ;;
            *) echo "本路 $IDX 不在清單 ⇒ 跳過（避免碰已成功的路）"; echo "SKIP_RUN=1" >> "$GITHUB_ENV" ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Playwright（含瀏覽器）
        if: ${{ env.SKIP_RUN != '1' }}
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      # 敏感值一律落 /tmp + chmod 600（公開 repo 的鐵律：不進 GITHUB_ENV）
      - name: 準備 secret 檔（profiles / 專屬出口）
        if: ${{ env.SKIP_RUN != '1' }}
        env:
          PROFILES_JSON: ${{ secrets.PROFILES_JSON }}
          SLOT_PROXIES_JSON: ${{ secrets.SLOT_PROXIES_JSON }}
          IDX: ${{ matrix.idx }}
          PROXY_MAP: ${{ github.event.inputs.proxy_map }}
        run: |
          set -e
          printf '%s' "$PROFILES_JSON" > /tmp/profiles.json
          chmod 600 /tmp/profiles.json
          python3 - <<'PY' > /tmp/proxy.env
          import json, os
          i = int(os.environ["IDX"])
          arr = json.loads(os.environ.get("SLOT_PROXIES_JSON") or "[]")
          # 形狀＝list of dict：{"host","port","user","pass"}（與 scanner.yml 的
          # per-slot listener 生成同一份 secret）
          # ⚡ 10/15：出口不足時用 PROXY_MAP 讓同幾個乾淨出口**循環**給不同路用
          # （配 slots 分兩波跑：先 slots=0,1,2,3,4，再 slots=5,6,7,8,9）
          _m = [x for x in (os.environ.get("PROXY_MAP") or "").replace(" ", "").split(",") if x.isdigit()]
          j = int(_m[i % len(_m)]) if _m else i
          print("PROXY_IDX_USED=%d" % j)
          row = arr[j] if 0 <= j < len(arr) else {}
          h, p, u, w = (row.get("host", ""), row.get("port", ""),
                        row.get("user", ""), row.get("pass", ""))
          print("DUO_PROXY_SERVER=%s:%s" % (h, p) if h else "DUO_PROXY_SERVER=")
          print("DUO_PROXY_USER=%s" % u)
          print("DUO_PROXY_PASS=%s" % w)
          print("PROXY_COUNT=%d" % len(arr))
          PY
          chmod 600 /tmp/proxy.env
          grep -c . /tmp/proxy.env >/dev/null
          python3 -c "import json;print('profiles:',len(json.load(open('/tmp/profiles.json')).get('profiles',[])))"

      - name: 下單（一 profile 一出口，重試到期限）
        if: ${{ env.SKIP_RUN != '1' }}
        env:
          GH_PAT: ${{ secrets.CHECKOUT_PAT }}
          BARK_URL: ${{ secrets.BARK_URL }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}   # 專案現用 PUSHOVER_*，留著無害
          # 路號模式：profile 名（secret 內第 idx 個）與款式（VARIANTS[idx]）都在 runner 內決定
          PROFILE_IDX: ${{ matrix.idx }}
          PROFILE: ""
          SKU: ""
          AUTO_JSON: ${{ github.event.inputs.auto_json || 'auto_duo.json' }}
          FULFILLMENT: HOME
          BUY_COUNT: ${{ github.event.inputs.buy_count || '2' }}
          ENGINE_DIR: engine
          HEADLESS: "1"
          # ⚡ 10/08：入袋是**機率閘**（今天 2 路彩排各 1 發都遇到 http200 但無結帳標記）
          # ⇒ 把重載/重試次數拉高（生產舊值 3/3 太保守）。10/15 起因 workflow input 可調。
          ADD_RETRY_ROUNDS: ${{ github.event.inputs.add_rounds || '6' }}
          ADD_RETRY_RELOAD_UNTIL: ${{ github.event.inputs.add_reload || '10' }}
          ADD_RETRY_WAIT_S: "6"
          # 🧪 假資料模式（假卡＋必配 DRY_RUN；互鎖在 workflow 與 duo_job 兩層）
          DUMMY_PROFILES: ${{ github.event.inputs.dummy == 'true' && '1' || '0' }}
          # ⚠ GitHub 表達式的空字串是 falsy ⇒ `live && '' || '1'` 恆為 '1'（10/07 實跑抓到的坑：
          # 明明選 live 卻 dry）。改用明確的兩態值：dry⇒true、live⇒false。
          DRY_RUN: ${{ github.event.inputs.mode == 'dry' && 'true' || 'false' }}
          DUO_WAIT_UNTIL: ${{ github.event.inputs.wait_until }}
          DUO_DEADLINE_MIN: ${{ github.event.inputs.deadline_min || '40' }}
          DUO_MAX_ATTEMPTS: ${{ github.event.inputs.max_attempts || '3' }}
          # use_app_config=true ⇒ 不指定款式，照 auto_json 的 candidates 走（App 的下單配置）
          USE_APP_CONFIG: ${{ github.event.inputs.use_app_config == 'true' && '1' || '0' }}
          # ⚡ 10/15：Apple 當晚若改商品頁網址／改路徑，用這兩個 input 就地改目標（免改碼、免重推 repo）
          DUO_PRODUCT_URL: ${{ github.event.inputs.product_url }}
          DUO_LINE_MARKER: ${{ github.event.inputs.line_marker }}
          # 入袋方式（空=頁面內 fetch；ui=真 UI 點擊）
          ADD_MODE: ${{ github.event.inputs.add_mode }}
        run: |
          set -a; . /tmp/proxy.env; set +a
          export PROFILES_JSON="$(cat /tmp/profiles.json)"
          echo "profile=$PROFILE sku=$SKU dry_run=${DRY_RUN:-0} proxy=$DUO_PROXY_SERVER (出口索引=${PROXY_IDX_USED:-?}/$PROXY_COUNT)"
          python3 tools/duo_job.py
        continue-on-error: true

      - name: 結果摘要（帳本尾 + 截圖清單）
        if: always()
        run: |
          echo "---- 本機帳本尾 10 行 ----"
          tail -10 engine/status/hits.jsonl 2>/dev/null || echo "(無帳本)"
          echo "---- 截圖 ----"
          ls -la engine/status/*.png 2>/dev/null | tail -5 || echo "(無截圖)"
          echo "---- latest.json ----"
          cat engine/status/latest.json 2>/dev/null | head -c 600 || true
